[package]
name = "lantern_scan"
version = "0.1.9"
edition = "2021"
description = "Lili enterprise NET — Consola de Inteligencia de Red y Asistencia Remota"
license = "MIT"

[dependencies]
eframe = "0.29"
dns-lookup = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"
